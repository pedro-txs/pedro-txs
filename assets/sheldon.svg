<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" role="img" aria-label="73 is the best number, because 73 is the 21st prime number. Its mirror (37) is the 12th prime, and the mirror of 12 is 21, which is exactly the product of 7 and 3. Another quirk: 73 in binary is 1001001, a palindrome.">
