<text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="17" fill="#e6edf3" dy="-8" xml:space="preserve"><textPath href="#w" startOffset="3774"><tspan fill="#ffb454" font-weight="700">73</tspan> is the best number, because <tspan fill="#ffb454" font-weight="700">73</tspan> is the <tspan fill="#5ee7ff">21st</tspan> prime number. Its mirror (<tspan fill="#ffb454" font-weight="700">37</tspan>) is the <tspan fill="#5ee7ff">12th</tspan> prime, and the mirror of <tspan fill="#5ee7ff">12</tspan> is <tspan fill="#5ee7ff">21</tspan>, which is exactly the product of <tspan fill="#5ee7ff">7</tspan> and <tspan fill="#5ee7ff">3</tspan>. Another quirk: <tspan fill="#ffb454" font-weight="700">73</tspan> in binary is <tspan fill="#5ee7ff">1001001</tspan>, a palindrome — read it backwards and it's still <tspan fill="#5ee7ff">1001001</tspan>.<animate attributeName="startOffset" from="3774" to="0" dur="62s" repeatCount="indefinite"/></textPath></text>
</g>
